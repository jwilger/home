name: Update ChatGPT desktop

on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-chatgpt
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: cachix/install-nix-action@v31
      - name: Download and update version and hash
        id: update
        run: |
          python3 scripts/update-chatgpt
          if ! git diff --quiet -- modules/home/desktop/chatgpt.nix; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Build updated ChatGPT package
        if: steps.update.outputs.changed == 'true'
        run: |
          nix build --impure --no-link --print-build-logs --expr '
            let
              flake = builtins.getFlake (toString ./.);
              pkgs = import flake.inputs.nixpkgs { system = "x86_64-linux"; config.allowUnfree = true; };
            in (import ./modules/home/desktop/chatgpt.nix { inherit pkgs; lib = pkgs.lib; }).home.packages
          '
      - name: Commit and push update
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules/home/desktop/chatgpt.nix
          git commit -m 'chore: update ChatGPT desktop'
          git push
