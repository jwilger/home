name: Update Codex CLI

on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-agent-packages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: cachix/install-nix-action@v31
      - name: Validate and update Codex version and hash
        id: update
        run: |
          python3 -m unittest discover -s tests -p test_codex_updater.py
          python3 scripts/update-codex
          if ! git diff --quiet -- modules/home/codex/package.nix; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Build and verify updated Codex package
        if: steps.update.outputs.changed == 'true'
        run: |
          package=$(nix build .#codex --no-link --print-out-paths --print-build-logs)
          "$package/bin/codex" --version
          test -x "$package/bin/codex-code-mode-host"
      - name: Commit and push update
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules/home/codex/package.nix
          git commit -m 'chore: update Codex CLI'
          git push
